name: 功能建议 / Feature request
description: 提出新功能或交互改进建议 / Suggest a feature or usability improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        支持中文或英文。请先搜索已有建议，并说明你的使用场景。
        Chinese and English are welcome. Search existing requests and describe your use case.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 当前操作遇到了什么困难？/ What is difficult about the current experience?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进 / Proposed improvement
      description: 描述期望的操作或界面变化 / Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充说明 / Additional context
      description: 可附替代方案、参考链接或截图；请遮蔽私人信息 / Optional alternatives, links, or screenshots; redact private information.
