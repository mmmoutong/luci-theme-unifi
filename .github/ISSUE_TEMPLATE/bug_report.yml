name: Bug report
description: Report a problem with luci-theme-unifi.
body:
  - type: input
    id: firmware
    attributes:
      label: OpenWrt firmware version
      placeholder: OpenWrt 23.05.5 / ImmortalWrt 23.05.4
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      placeholder: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Paste or drag screenshots here.
